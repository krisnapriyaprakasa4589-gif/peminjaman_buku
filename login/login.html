<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login - Universitas Jenderal Ahmad Yani</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f3f6fb;--card:#fff;--accent:#2563eb;--muted:#6b7280;--danger:#ef4444;font-family:Inter,system-ui,sans-serif}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg),#eef4ff);}
    .container{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
    .card{width:100%;max-width:420px;background:var(--card);border-radius:12px;box-shadow:0 6px 30px rgba(16,24,40,0.08);padding:28px}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
    .logo{width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#4f46e5);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
    h1{font-size:20px;margin:0}
    p.lead{margin:6px 0 18px;color:var(--muted);font-size:14px}
    form{display:grid;gap:12px}
    label{font-size:13px;color:#111827;margin-bottom:6px;display:block}
    input, select{width:100%;padding:12px 14px;border:1px solid #e6e9ef;border-radius:8px;font-size:14px}
    .btn{margin-top:6px;padding:12px 14px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-weight:600;cursor:pointer}
    .switch{margin-top:14px;text-align:center;font-size:14px}
    .error{color:var(--danger);font-size:13px;display:none;margin-top:6px}
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="brand">
        <div class="logo">UP</div>
        <div>
          <h1>Login Universitas Jenderal Ahmad Yani</h1>
          <p class="lead">Masuk sebagai Mahasiswa atau Petugas</p>
        </div>
      </div>

      <form id="loginForm">
        <div>
          <label for="role">Masuk sebagai</label>
          <select id="role">
            <option value="mahasiswa">Mahasiswa</option>
            <option value="petugas">Petugas</option>
          </select>
        </div>

        <div>
          <label for="username">Username / NIM</label>
          <input type="text" id="username" placeholder="Masukkan username/NIM">
        </div>

        <div>
          <label for="password">Kata Sandi</label>
          <input type="password" id="password" placeholder="Masukkan password">
        </div>

        <button class="btn" type="submit">Masuk</button>
        <div id="error" class="error"></div>
      </form>

      <div class="switch">
        Belum punya akun? <a href="register.html">Daftar di sini</a>
      </div>
    </div>
  </div>

<script>
document.getElementById("loginForm").addEventListener("submit", async (e)=>{
    e.preventDefault();

    const role = document.getElementById("role").value;
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!role || !username || !password) {
        alert("Harap isi semua field!");
        return;
    }

    const form = new FormData();
    form.append("role", role);
    form.append("username", username);
    form.append("password", password);

    const res = await fetch("../backend/login.php", {
        method: "POST",
        body: form
    });

    const j = await res.json();

    if(j.ok){
        sessionStorage.setItem("currentUser", JSON.stringify(j.user));

        if(j.user.role === "mahasiswa"){
            window.location.href="../dashboard/dashboardMahasiswa.html";
        } else {
            window.location.href="../dashboardpetugas/dashboardPetugas.html";
        }
    } else {
        alert(j.msg);
    }
});
</script>

</body>
</html>
